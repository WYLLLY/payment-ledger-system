[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "payment-ledger"
version = "0.1.0"
description = "Payment & Ledger System — FastAPI and PostgreSQL foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.13.1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/payment_ledger"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".local", ".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "migrations", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: requires a dedicated real PostgreSQL cluster"]
