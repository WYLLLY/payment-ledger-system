services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: payment_ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/init_env.py}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Generate .env with scripts/init_env.py}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${APP_DB_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-migrator.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_ledger"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: payment-ledger:local
    environment:
      APP_DB_HOST: db
      APP_DB_PORT: "5432"
      APP_DB_NAME: payment_ledger
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Generate .env with scripts/init_env.py}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Generate .env with scripts/init_env.py}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Generate worker secret in .env}
    command: ["sh", "-c", "alembic upgrade head && python scripts/provision_app.py"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    image: payment-ledger:local
    environment:
      APP_DB_HOST: db
      APP_DB_PORT: "5432"
      APP_DB_NAME: payment_ledger
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Generate .env with scripts/init_env.py}
      APP_SESSION_TTL_SECONDS: ${APP_SESSION_TTL_SECONDS:-3600}
      APP_AUTH_RATE_LIMIT: ${APP_AUTH_RATE_LIMIT:-20}
      APP_AUTH_RATE_WINDOW_SECONDS: ${APP_AUTH_RATE_WINDOW_SECONDS:-60}
      APP_FINANCIAL_RATE_LIMIT: ${APP_FINANCIAL_RATE_LIMIT:-60}
      APP_FINANCIAL_RATE_WINDOW_SECONDS: ${APP_FINANCIAL_RATE_WINDOW_SECONDS:-60}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=8)"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 5s

  provider:
    image: payment-ledger:local
    command: ["uvicorn", "payment_ledger.payments.simulator:create_app", "--factory", "--host", "0.0.0.0", "--port", "8001", "--no-proxy-headers", "--no-access-log"]
    environment:
      PROVIDER_DB_PATH: /data/provider.sqlite3
    volumes:
      - provider_data:/data
    ports:
      - "127.0.0.1:${PROVIDER_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    image: payment-ledger:local
    command: ["python", "-m", "payment_ledger.payments.worker"]
    environment:
      WORKER_DB_HOST: db
      WORKER_DB_PORT: "5432"
      WORKER_DB_NAME: payment_ledger
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Generate worker secret in .env}
      WORKER_PROVIDER_URL: http://provider:8001
    depends_on:
      migrate:
        condition: service_completed_successfully
      provider:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  provider_data:
