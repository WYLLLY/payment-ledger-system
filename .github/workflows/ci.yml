name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * 2"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen
      - name: Lint, formatting and types
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy
      - name: Unit and HTTP contract tests
        run: uv run --frozen pytest tests/unit
      - name: Generate isolated credentials
        run: |
          python scripts/init_env.py
          while IFS='=' read -r name value; do
            case "$name" in
              POSTGRES_PASSWORD|MIGRATION_DB_PASSWORD|APP_DB_PASSWORD|WORKER_DB_PASSWORD)
                printf '::add-mask::%s\n' "$value"
                ;;
            esac
          done < .env
      - name: Validate Compose and start PostgreSQL, migrations and API
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 180
      - name: Real PostgreSQL, privileges and migrations
        run: uv run --frozen pytest tests/integration
      - name: Verify running HTTP server
        run: |
          curl --fail --silent http://127.0.0.1:8000/health/live
          curl --fail --silent http://127.0.0.1:8000/health/ready
          uv run --frozen python scripts/smoke_api.py
          PAYMENT_LEDGER_DEV_FIXTURES=1 uv run --frozen python -m scripts.smoke_payments
      - name: Verify locked Python dependencies and application runtime
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/payment-requirements.txt
          uvx --from pip-audit==2.10.0 pip-audit --disable-pip --require-hashes -r /tmp/payment-requirements.txt
          mkdir -p image-scan
          docker image save payment-ledger:local -o /tmp/payment-image.tar
          docker run --rm -v /tmp/payment-image.tar:/image.tar:ro -v "$PWD/image-scan:/out" aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output /out/runtime.json
      - name: Preserve application image scan
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: payment-image-scan
          path: image-scan/
          if-no-files-found: ignore
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up isolated CI volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
